services:
  user-service:
    build: .
    container_name: user-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/user_service.db
      # JWT 非对称加密（RS256）：私钥/公钥 PEM 通过 ./keys 卷只读注入（勿烘焙进镜像）
      - JWT_PRIVATE_KEY=keys/jwt_private.pem
      - JWT_PUBLIC_KEY=keys/jwt_public.pem
      - ALGORITHM=RS256
      - LOG_LEVEL=INFO
    volumes:
      # 密钥目录只读挂载（容器仅读取；私钥勿提交仓库，公钥可分发给其他服务校验）
      - ./keys:/app/keys:ro
      # SQLite 数据库及 WAL/SHM 辅助文件持久化到宿主机 ./data 目录
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
